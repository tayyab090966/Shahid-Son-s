<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#196F3D" />
      <stop offset="100%" stop-color="#145A32" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1C40F" />
      <stop offset="100%" stop-color="#D4AC0D" />
    </linearGradient>
  </defs>
  <!-- Main Background Container -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <!-- Inner Golden/Green Accent Ring -->
  <rect x="24" y="24" width="464" height="464" rx="90" fill="none" stroke="url(#goldGrad)" stroke-width="12" opacity="0.8" />
  
  <!-- Stylized Elegant Ledger Book Symbol -->
  <g transform="translate(128, 110)">
    <!-- Book Background Shadow -->
    <rect x="8" y="12" width="240" height="280" rx="20" fill="#0E3E20" opacity="0.4" />
    <!-- Book Base / Cover -->
    <rect x="0" y="0" width="240" height="280" rx="20" fill="url(#goldGrad)" />
    <!-- Spine Accent line -->
    <rect x="0" y="0" width="45" height="280" rx="10" fill="#B7950B" />
    <!-- Spine Gold Details -->
    <line x1="12" y1="50" x2="33" y2="50" stroke="#F1C40F" stroke-width="4" stroke-linecap="round" />
    <line x1="12" y1="140" x2="33" y2="140" stroke="#F1C40F" stroke-width="4" stroke-linecap="round" />
    <line x1="12" y1="230" x2="33" y2="230" stroke="#F1C40F" stroke-width="4" stroke-linecap="round" />
    
    <!-- Ledger Book Pages Area -->
    <rect x="65" y="25" width="150" height="230" rx="6" fill="#FFFFFF" />
    
    <!-- Cash Ledger Lines with Green Entry (Income) and Red Entry (Expense) -->
    <!-- Green Income line -->
    <line x1="85" y1="65" x2="195" y2="65" stroke="#196F3D" stroke-width="5" stroke-linecap="round" />
    <circle cx="85" cy="65" r="4" fill="#2ECC71" />
    
    <!-- Red Expense line -->
    <line x1="85" y1="115" x2="195" y2="115" stroke="#7B241C" stroke-width="5" stroke-linecap="round" opacity="0.8" />
    <circle cx="85" cy="115" r="4" fill="#E74C3C" />
    
    <!-- Balance line -->
    <line x1="85" y1="165" x2="195" y2="165" stroke="#196F3D" stroke-width="5" stroke-linecap="round" />
    <circle cx="85" cy="165" r="4" fill="#2D3E50" />
    
    <!-- Decorative Checkmark for Balance -->
    <path d="M140,210 L155,225 L185,195" fill="none" stroke="#27AE60" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  
  <!-- Text Label "S&S" in elegant typeface -->
  <text x="256" y="445" font-family="'Inter', system-ui, sans-serif" font-weight="900" font-size="34" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">SHAHID &amp; SONS</text>
</svg>
